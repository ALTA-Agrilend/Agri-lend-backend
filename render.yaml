# Render blueprint for the AgriLend FastAPI backend.
# Deploy with: Render Dashboard -> New -> Blueprint -> point at this repository.
services:
  - type: web
    name: agrilend-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: agrilend-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      # Update after your first Vercel deploy with the real frontend URL.
      - key: CORS_ORIGINS
        value: '["http://localhost:5173","https://your-app.vercel.app"]'

databases:
  - name: agrilend-db
    plan: free
    databaseName: agrilend
    user: agrilend
